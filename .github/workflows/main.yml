name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Node.js environment
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies and run tests (if package.json exists)
      - name: Install Dependencies
        run: npm ci || npm install

      # 4. Log in to Docker Hub using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 5. Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            prominentchinonso2004/multi-vendor-app:latest
            prominentchinonso2004/multi-vendor-app:${{ github.sha }}

      # 6. Set up Kubernetes local cluster (Kind)
      - name: Set up Kubernetes (Kind)
        uses: helm/kind-action@v1.8.0
        with:
          cluster_name: kind-cluster

      # 7. Apply Kubernetes manifests
      - name: Deploy Kubernetes Manifests
        run: |
          kubectl apply -f k8s/ || kubectl apply -f .
          kubectl get pods -A
